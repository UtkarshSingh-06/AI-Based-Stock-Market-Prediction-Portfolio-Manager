# ==========================================
# Stock Predictor Production Stack
# PostgreSQL, Redis, FastAPI, Celery, Nginx, Prometheus, Grafana, PgAdmin
# ==========================================

services:
  # ------------------------------
  # PostgreSQL Database
  # ------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: stockpred-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-stockuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-securepassword123}"
      POSTGRES_DB: "${POSTGRES_DB:-stockprediction}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stockprediction"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockpred-network
    restart: unless-stopped

  # ------------------------------
  # Redis
  # ------------------------------
  redis:
    image: redis:7-alpine
    container_name: stockpred-redis
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redispassword123}"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stockpred-network
    restart: unless-stopped

  # ------------------------------
  # Backend (FastAPI)
  # ------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stockpred-backend:latest
    container_name: stockpred-backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-stockuser}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-stockprediction}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-your-secret-key-change-in-production}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}"
      MODELS_DIR: /app/models
      ENVIRONMENT: production
    volumes:
      - ./backend:/app
      - models_data:/app/models
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - stockpred-network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4

  # ------------------------------
  # Celery Worker
  # ------------------------------
  celery-worker:
    image: stockpred-backend:latest
    container_name: stockpred-celery-worker
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-stockuser}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-stockprediction}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-your-secret-key-change-in-production}"
      MODELS_DIR: /app/models
    volumes:
      - ./backend:/app
      - models_data:/app/models
      - ./logs:/app/logs
    networks:
      - stockpred-network
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4

  # ------------------------------
  # Celery Beat (Scheduler)
  # ------------------------------
  celery-beat:
    image: stockpred-backend:latest
    container_name: stockpred-celery-beat
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-stockuser}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-stockprediction}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-your-secret-key-change-in-production}"
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    networks:
      - stockpred-network
    restart: unless-stopped
    command: celery -A tasks.celery_app beat --loglevel=info

  # ------------------------------
  # Nginx
  # ------------------------------
  nginx:
    image: nginx:alpine
    container_name: stockpred-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - stockpred-network
    restart: unless-stopped

  # ------------------------------
  # Prometheus
  # ------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: stockpred-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - stockpred-network
    restart: unless-stopped

  # ------------------------------
  # Grafana
  # ------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: stockpred-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin123}"
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - stockpred-network
    restart: unless-stopped

  # ------------------------------
  # PgAdmin
  # ------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stockpred-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@stockpred.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-admin123}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - stockpred-network
    restart: unless-stopped

# ------------------------------
# Volumes
# ------------------------------
volumes:
  postgres_data:
  redis_data:
  models_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:

# ------------------------------
# Network
# ------------------------------
networks:
  stockpred-network:
    driver: bridge
