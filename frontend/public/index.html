<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta
      name="description"
      content="Advanced Stock Prediction Platform with Machine Learning - Predict stock prices using GRU neural networks with confidence intervals and backtesting."
    />
    <meta name="keywords" content="stock prediction, machine learning, GRU, LSTM, trading, AI, financial analytics" />
    <meta name="author" content="Stock Predictor AI Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stockpredictor.ai/" />
    <meta property="og:title" content="Stock Predictor AI - Advanced ML Trading Platform" />
    <meta property="og:description" content="Predict stock prices with state-of-the-art machine learning models" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stockpredictor.ai/" />
    <meta property="twitter:title" content="Stock Predictor AI - Advanced ML Trading Platform" />
    <meta property="twitter:description" content="Predict stock prices with state-of-the-art machine learning models" />
    <meta property="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts - Inter for modern UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" 
      rel="stylesheet" 
    />
    
    <!-- Fira Code for code snippets -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" 
      rel="stylesheet" 
    />
    
    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    
    <!-- Title -->
    <title>Stock Predictor AI - Advanced ML Trading Platform</title>
    
    <!-- Inline critical CSS for faster initial render -->
    <style>
      /* Prevent flash of unstyled content */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Loading spinner styles */
      .loading-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #334155;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Hide loading when app loads */
      .app-loaded .loading-container {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        text-align: center;
        padding: 20px;
      ">
        <div>
          <h1 style="font-size: 2rem; margin-bottom: 1rem;">JavaScript Required</h1>
          <p style="font-size: 1.1rem; color: #94a3b8;">
            You need to enable JavaScript to run this application.
            <br />
            Stock Predictor AI uses modern web technologies that require JavaScript.
          </p>
        </div>
      </div>
    </noscript>
    
    <!-- Loading spinner (shown before React loads) -->
    <div class="loading-container" id="loading">
      <div class="loading-spinner"></div>
    </div>
    
    <!-- React root -->
    <div id="root"></div>
    
    <!-- Hide loading spinner when React app loads -->
    <script>
      window.addEventListener('load', function() {
        document.body.classList.add('app-loaded');
      });
    </script>

  </body>
</html>
